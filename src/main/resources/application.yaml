logging:
  level:
    root: WARN
    com.binitech: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    org.mongodb: WARN
    com.rabbitmq: WARN
    io.lettuce: WARN
    org.apache: WARN

spring:
  application:
    name: BiniTech PDV
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: binitech_pdv
    redis:
      url: ${REDIS_URL}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 8.2.5

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}

security:
  pepper: ${SECURITY_PEPPER}
  dummy-password-hash: ${SECURITY_DUMMY_PASSWORD_HASH}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-starter: ${STRIPE_PRICE_STARTER:}
  price-pro: ${STRIPE_PRICE_PRO:}
  price-enterprise: ${STRIPE_PRICE_ENTERPRISE:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:BiniTech PDV <onboarding@resend.dev>}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
