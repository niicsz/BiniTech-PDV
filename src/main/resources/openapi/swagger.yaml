openapi: 3.0.3
info:
  title: BiniTech PDV API
  description: API do Sistema Frente de Caixa (PDV) da BiniTech
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Servidor local de desenvolvimento

tags:
  - name: Auth
    description: Autenticação e registro de usuários
  - name: Products
    description: Operações de cadastro e consulta de produtos
  - name: ProductImportIntegration
    description: Contrato interno em lote para o serviço de importação
  - name: Sales
    description: Operações de venda e relatórios
  - name: Users
    description: Gerenciamento de usuários do tenant autenticado
  - name: Delivery
    description: Pedidos e configuração do delivery da loja
  - name: CashSessions
    description: Abertura, sangria, suprimento e fechamento de caixa
  - name: Pix
    description: Pix integrado com QR dinâmico e baixa automática
  - name: PublicDelivery
    description: Cardápio e pedidos públicos do delivery

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Fazer login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDTO'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '400':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar novo usuário (somente ADMIN)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDTO'
      responses:
        '201':
          description: Usuário registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token usando refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequestDTO'
      responses:
        '200':
          description: Token renovado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDTO'
        '400':
          description: Refresh token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Dados do usuário autenticado (papel e loja segundo o PDV)
      description: >-
        Usado pelos serviços internos (como o BiniTech Fiscal) para saber o papel do usuário.
        O papel vem do cadastro de usuários do PDV, que é a fonte oficial de permissões.
      operationId: currentUser
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserDTO'
        '401':
          description: Sessão ausente, inválida ou usuário inativo

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Fazer logout e invalidar token
      operationId: logout
      responses:
        '204':
          description: Logout realizado com sucesso

  /api/users:
    get:
      tags: [Users]
      summary: Listar usuários do tenant autenticado
      operationId: listTenantUsers
      responses:
        '200':
          description: Usuários do tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '403':
          description: Usuário sem permissão
    post:
      tags: [Users]
      summary: Criar usuário no tenant autenticado
      operationId: createTenantUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Role sem permissão ou tentativa de escalação

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Buscar usuário dentro do tenant autenticado
      operationId: getTenantUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: Usuário não pertence ao tenant ou não existe

  /api/users/{id}/status:
    patch:
      tags: [Users]
      summary: Ativar ou desativar usuário do tenant autenticado
      operationId: updateTenantUserStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status alterado e sessões anteriores revogadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Usuário fora da hierarquia permitida

  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Alterar role dentro da hierarquia permitida
      operationId: updateTenantUserRole
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Role alterada e sessões anteriores revogadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '403':
          description: Tentativa de atribuir privilégio não permitido

  /api/users/{id}/two-factor/reset:
    post:
      tags: [Users]
      summary: Redefinir a verificação em duas etapas de um usuário da hierarquia permitida
      operationId: resetTenantUserTwoFactor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Chave, códigos de recuperação e bloqueio removidos; reset=false quando o usuário não tinha 2FA
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset:
                    type: boolean
        '403':
          description: Usuário fora da hierarquia permitida ou a própria conta
        '404':
          description: Usuário não pertence ao tenant ou não existe

  /api/products:
    get:
      tags: [Products]
      summary: Listar todos os produtos
      operationId: listProducts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Lista de produtos retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductDTO'
    post:
      tags: [Products]
      summary: Cadastrar um novo produto
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDTO'
      responses:
        '201':
          description: Produto criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/products/{id}:
    get:
      tags: [Products]
      summary: Buscar produto por ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    put:
      tags: [Products]
      summary: Atualizar um produto existente
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductDTO'
      responses:
        '200':
          description: Produto atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    delete:
      tags: [Products]
      summary: Desativar um produto
      operationId: deactivateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Produto desativado com sucesso
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/products/barcode/{barcode}:
    get:
      tags: [Products]
      summary: Buscar produto por código de barras (leitura rápida)
      operationId: getProductByBarcode
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/internal/product-import/authorize:
    post:
      tags: [ProductImportIntegration]
      operationId: authorizeProductImport
      summary: Validar vínculo, permissão e situação do tenant
      parameters:
        - $ref: '#/components/parameters/ProductImportServiceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportIdentityDTO' }
      responses:
        '204': { description: Operação autorizada }
        '403': { description: Usuário ou tenant sem permissão }

  /api/internal/product-import/lookup:
    post:
      tags: [ProductImportIntegration]
      operationId: lookupProductsForImport
      summary: Consultar produtos existentes por barcode em lote
      parameters:
        - $ref: '#/components/parameters/ProductImportServiceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportLookupRequestDTO' }
      responses:
        '200':
          description: Produtos existentes no tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportLookupResponseDTO' }

  /api/internal/product-import/apply:
    post:
      tags: [ProductImportIntegration]
      operationId: applyProductImportBatch
      summary: Aplicar lote idempotente de criação/atualização
      parameters:
        - $ref: '#/components/parameters/ProductImportServiceKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportBatchRequestDTO' }
      responses:
        '200':
          description: Resultado individual do lote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchResponseDTO' }

  /api/sales:
    post:
      tags: [Sales]
      summary: Registrar uma nova venda
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleDTO'
      responses:
        '201':
          description: Venda registrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDTO'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    get:
      tags: [Sales]
      summary: Listar vendas com filtro por data
      operationId: listSales
      parameters:
        - name: date
          in: query
          required: false
          description: Data específica (formato yyyy-MM-dd) para extrato do dia
          schema:
            type: string
            format: date
        - name: startDate
          in: query
          required: false
          description: Data inicial do período (formato yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Data final do período (formato yyyy-MM-dd)
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Lista de vendas retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleDTO'

  /api/sales/{id}:
    get:
      tags: [Sales]
      summary: Buscar venda por ID
      operationId: getSaleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Venda encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDTO'
        '404':
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/sales/{id}/mark-paid:
    patch:
      tags: [Sales]
      summary: Marcar venda crediário como paga
      operationId: markSaleAsPaid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Venda marcada como paga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDTO'
        '404':
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/sales/{id}/returns:
    post:
      tags: [Sales]
      summary: Registrar a devolução total ou parcial de uma venda
      description: >-
        Só o administrador da loja pode registrar devoluções. Os itens podem voltar ao estoque
        e o reembolso fica registrado na forma escolhida. Em venda no fiado ainda não paga,
        o reembolso é o abatimento do débito.
      operationId: registerSaleReturn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleReturnDTO'
      responses:
        '201':
          description: Devolução registrada; devolve a venda atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDTO'
        '400':
          description: Itens, quantidades ou forma de reembolso inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '403':
          description: Usuário sem permissão para devoluções
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Venda não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/sales/debtors:
    get:
      tags: [Sales]
      summary: Listar vendas com crediário não pagas (devedores)
      operationId: listDebtors
      responses:
        '200':
          description: Lista de vendas crediário não pagas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleDTO'

  /api/cash-sessions:
    get:
      tags: [CashSessions]
      summary: Listar caixas abertos no período (administrador vê todos, operador só os seus)
      operationId: listCashSessions
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Caixas mais recentes primeiro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashSessionDTO'
        '400':
          description: Período inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
    post:
      tags: [CashSessions]
      summary: Abrir o caixa do operador com o troco inicial
      operationId: openCashSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCashSessionDTO'
      responses:
        '201':
          description: Caixa aberto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionDTO'
        '400':
          description: Já existe caixa aberto ou valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/cash-sessions/current:
    get:
      tags: [CashSessions]
      summary: Caixa aberto do operador logado
      operationId: getCurrentCashSession
      responses:
        '200':
          description: Caixa aberto com o resumo do turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionDTO'
        '204':
          description: Nenhum caixa aberto

  /api/cash-sessions/{id}:
    get:
      tags: [CashSessions]
      summary: Detalhe de um caixa
      operationId: getCashSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caixa com o resumo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionDTO'
        '404':
          description: Caixa não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/cash-sessions/{id}/movements:
    post:
      tags: [CashSessions]
      summary: Registrar sangria ou suprimento
      operationId: addCashMovement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashMovementDTO'
      responses:
        '201':
          description: Movimento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionDTO'
        '400':
          description: Valor inválido, caixa fechado ou sangria maior que o dinheiro do caixa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/cash-sessions/{id}/close:
    post:
      tags: [CashSessions]
      summary: Fechar o caixa informando o dinheiro contado
      operationId: closeCashSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCashSessionDTO'
      responses:
        '200':
          description: Caixa fechado com o resumo final
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionDTO'
        '400':
          description: Caixa já fechado ou valor inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/pix/settings:
    get:
      tags: [Pix]
      summary: Configuração do Pix integrado da loja
      operationId: getPixSettings
      responses:
        '200':
          description: Configuração atual (o token nunca é devolvido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixSettingsDTO'
        '404':
          description: Pix integrado indisponível ou cobrança não encontrada
    put:
      tags: [Pix]
      summary: Ligar, desligar e informar as credenciais do Mercado Pago
      operationId: updatePixSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePixSettingsDTO'
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixSettingsDTO'
        '400':
          description: Token recusado ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '403':
          description: Só o administrador da loja altera o Pix
        '404':
          description: Pix integrado indisponível ou cobrança não encontrada

  /api/pix/charges:
    post:
      tags: [Pix]
      summary: Gerar a cobrança Pix de uma venda (a venda só é registrada depois do pagamento)
      operationId: createPixCharge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleDTO'
      responses:
        '201':
          description: QR gerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixChargeDTO'
        '400':
          description: Venda inválida ou Pix integrado desligado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Pix integrado indisponível ou cobrança não encontrada

  /api/pix/charges/{id}:
    get:
      tags: [Pix]
      summary: Situação da cobrança Pix (consulta o Mercado Pago se ainda estiver pendente)
      operationId: getPixCharge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Situação atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixChargeDTO'
        '404':
          description: Pix integrado indisponível ou cobrança não encontrada

  /api/pix/charges/{id}/cancel:
    post:
      tags: [Pix]
      summary: Cancelar a cobrança Pix ainda não paga
      operationId: cancelPixCharge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Situação depois do cancelamento (pode ter sido paga antes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixChargeDTO'
        '404':
          description: Pix integrado indisponível ou cobrança não encontrada

  /api/delivery/settings:
    get:
      tags: [Delivery]
      summary: Configuração do delivery da loja
      operationId: getDeliverySettings
      responses:
        '200':
          description: Configuração atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverySettingsDTO'
        '404':
          description: Delivery indisponível neste ambiente
    put:
      tags: [Delivery]
      summary: Atualizar a configuração do delivery
      operationId: updateDeliverySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliverySettingsDTO'
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliverySettingsDTO'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/delivery/orders:
    get:
      tags: [Delivery]
      summary: Listar pedidos do delivery
      operationId: listDeliveryOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeliveryOrderStatusDTO'
      responses:
        '200':
          description: Pedidos mais recentes primeiro
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryOrderDTO'

  /api/delivery/orders/{id}/status:
    patch:
      tags: [Delivery]
      summary: Avançar ou cancelar um pedido
      operationId: updateDeliveryOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryOrderStatusDTO'
      responses:
        '200':
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderDTO'
        '400':
          description: Mudança de status não permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/delivery/orders/{id}/complete:
    post:
      tags: [Delivery]
      summary: Concluir o pedido e lançar a venda no caixa
      operationId: completeDeliveryOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteDeliveryOrderDTO'
      responses:
        '200':
          description: Pedido concluído e venda registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryOrderDTO'
        '400':
          description: Pedido não pode ser concluído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'

  /api/public/delivery/{slug}:
    get:
      tags: [PublicDelivery]
      summary: Cardápio público da loja
      operationId: getPublicDeliveryStore
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Loja e cardápio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDeliveryStoreDTO'
        '404':
          description: Loja sem delivery

  /api/public/delivery/{slug}/orders:
    post:
      tags: [PublicDelivery]
      summary: Enviar um pedido para a loja
      operationId: placeDeliveryOrder
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceDeliveryOrderDTO'
      responses:
        '201':
          description: Pedido recebido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedDeliveryOrderDTO'
        '400':
          description: Pedido inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '429':
          description: Muitos pedidos em sequência

  /api/public/delivery/{slug}/orders/{orderId}:
    get:
      tags: [PublicDelivery]
      summary: Acompanhar um pedido
      operationId: trackDeliveryOrder
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Situação do pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedDeliveryOrderDTO'
        '404':
          description: Pedido não encontrado

components:
  parameters:
    ProductImportServiceKey:
      name: X-Product-Import-Service-Key
      in: header
      required: true
      schema: { type: string, minLength: 32 }
  schemas:
    LoginRequestDTO:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        tenantId:
          type: string
          maxLength: 64

    RegisterRequestDTO:
      type: object
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 254
        password:
          type: string
          minLength: 6
          maxLength: 128
        tenantId:
          type: string
          maxLength: 64
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - ADMIN
            - TENANT_ADMIN
            - OPERATOR

    RefreshTokenRequestDTO:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          maxLength: 512

    AuthResponseDTO:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        username:
          type: string
        role:
          type: string
        tenantId:
          type: string
        twoFactorRequired:
          type: boolean
        challengeToken:
          type: string
        challengeExpiresAt:
          type: string
          format: date-time

    UserRole:
      type: string
      enum: [SUPER_ADMIN, ADMIN, TENANT_ADMIN, OPERATOR]

    CurrentUserDTO:
      type: object
      required: [userId, username, role]
      properties:
        userId:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        tenantId:
          type: string

    UserDTO:
      type: object
      required: [id, name, username, role, active, currentUser, manageable]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        currentUser:
          type: boolean
        manageable:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 6
          maxLength: 128
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserStatusRequest:
      type: object
      required: [active]
      properties:
        active:
          type: boolean

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'

    ProductDTO:
      type: object
      properties:
        id:
          type: string
        barcode:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        costPrice:
          type: number
          format: double
        stockQuantity:
          type: integer
        active:
          type: boolean
        category:
          type: string
        ncm:
          type: string
          pattern: '^\d{8}$'
          description: NCM do produto (8 dígitos), usado na NFC-e
        cfop:
          type: string
          pattern: '^\d{4}$'
          description: CFOP de venda (4 dígitos), usado na NFC-e
        csosn:
          type: string
          pattern: '^\d{3}$'
          description: CSOSN do ICMS (Simples Nacional/MEI), usado na NFC-e
        deliveryVisible:
          type: boolean
          description: Mostra o produto no cardápio do delivery
        userId:
          type: string
          readOnly: true

    CreateProductDTO:
      type: object
      required:
        - barcode
        - description
        - price
        - stockQuantity
      properties:
        barcode:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          minLength: 1
          maxLength: 200
        price:
          type: number
          format: double
          minimum: 0.01
          maximum: 1000000
        costPrice:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
        stockQuantity:
          type: integer
          minimum: 0
          maximum: 10000000
        category:
          type: string
          maxLength: 100
        ncm:
          type: string
          pattern: '^\d{8}$'
          description: NCM do produto (8 dígitos), usado na NFC-e
        cfop:
          type: string
          pattern: '^\d{4}$'
          description: CFOP de venda (4 dígitos), usado na NFC-e
        csosn:
          type: string
          pattern: '^\d{3}$'
          description: CSOSN do ICMS (Simples Nacional/MEI), usado na NFC-e
        active:
          type: boolean
        deliveryVisible:
          type: boolean
          description: Mostra o produto no cardápio do delivery

    SaleDTO:
      type: object
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItemDTO'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/PaymentDTO'
        totalAmount:
          type: number
          format: double
        totalCost:
          type: number
          format: double
        totalPaid:
          type: number
          format: double
        change:
          type: number
          format: double
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
          readOnly: true
        customerName:
          type: string
        customerPhone:
          type: string
        customerCpf:
          type: string
        paid:
          type: boolean
        status:
          $ref: '#/components/schemas/SaleStatusEnum'
        returnedAmount:
          type: number
          format: double
        returnedCost:
          type: number
          format: double
        returns:
          type: array
          items:
            $ref: '#/components/schemas/SaleReturnDTO'
        itemsTotal:
          type: number
          format: double
        discount:
          type: number
          format: double
        surcharge:
          type: number
          format: double
        cashSessionId:
          type: string

    SaleStatusEnum:
      type: string
      enum:
        - COMPLETED
        - PARTIALLY_RETURNED
        - RETURNED

    RefundMethodEnum:
      type: string
      enum:
        - CASH
        - PIX
        - CREDIT_CARD
        - DEBIT_CARD
        - DEBT_DEDUCTION

    SaleReturnDTO:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItemDTO'
        refundAmount:
          type: number
          format: double
        refundCost:
          type: number
          format: double
        refundMethod:
          $ref: '#/components/schemas/RefundMethodEnum'
        reason:
          type: string
        restocked:
          type: boolean

    CreateSaleReturnDTO:
      type: object
      required:
        - items
        - refundMethod
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/CreateSaleItemDTO'
        refundMethod:
          $ref: '#/components/schemas/RefundMethodEnum'
        reason:
          type: string
          maxLength: 255
        restock:
          type: boolean
          default: true

    SaleItemDTO:
      type: object
      properties:
        productId:
          type: string
        productDescription:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        costPrice:
          type: number
          format: double
        subtotal:
          type: number
          format: double
        discount:
          type: number
          format: double
        surcharge:
          type: number
          format: double

    CreateSaleDTO:
      type: object
      required:
        - items
        - payments
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateSaleItemDTO'
          maxItems: 500
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PaymentDTO'
          maxItems: 10
        customerName:
          type: string
          maxLength: 120
        customerPhone:
          type: string
          maxLength: 20
        customerCpf:
          type: string
          description: CPF do consumidor para a NFC-e (opcional)
          maxLength: 14
        skipStockValidation:
          type: boolean
        discount:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Desconto em reais sobre o total dos produtos
        surcharge:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Acréscimo em reais sobre o total dos produtos

    CreateSaleItemDTO:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 100000

    PaymentDTO:
      type: object
      required:
        - method
        - amount
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        amount:
          type: number
          format: double
          minimum: 0.01
          maximum: 10000000

    PaymentMethodEnum:
      type: string
      enum:
        - CASH
        - CREDIT_CARD
        - DEBIT_CARD
        - PIX
        - CREDIARIO

    ImportIdentityDTO:
      type: object
      required: [userId, tenantId]
      properties:
        userId: { type: string, minLength: 1, maxLength: 64 }
        tenantId: { type: string, minLength: 1, maxLength: 64 }

    ImportLookupRequestDTO:
      type: object
      required: [identity, barcodes]
      properties:
        identity: { $ref: '#/components/schemas/ImportIdentityDTO' }
        barcodes:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }

    ImportProductDTO:
      type: object
      properties:
        id: { type: string }
        barcode: { type: string }
        name: { type: string }
        price: { type: number }
        cost: { type: number }
        stockQuantity: { type: integer }
        category: { type: string }
        active: { type: boolean }
        ownerId: { type: string }

    ImportLookupResponseDTO:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items: { $ref: '#/components/schemas/ImportProductDTO' }

    ImportBatchRequestDTO:
      type: object
      required: [identity, mode, stockMode, updateFields, commands]
      properties:
        identity: { $ref: '#/components/schemas/ImportIdentityDTO' }
        mode: { type: string, enum: [CREATE_ONLY, CREATE_AND_UPDATE] }
        stockMode: { type: string, enum: [IGNORE, REPLACE, INCREMENT] }
        updateFields:
          type: array
          uniqueItems: true
          items: { type: string, enum: [NAME, PRICE, COST, CATEGORY, ACTIVE] }
        commands:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/ImportProductCommandDTO' }

    ImportProductCommandDTO:
      type: object
      required: [operationId, lineNumber, barcode, name, price, stockQuantity]
      properties:
        operationId: { type: string, minLength: 1, maxLength: 200 }
        lineNumber: { type: integer, minimum: 2, maximum: 1000000 }
        barcode: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        price: { type: number, minimum: 0.01, maximum: 1000000 }
        cost: { type: number, minimum: 0, maximum: 1000000 }
        stockQuantity: { type: integer, minimum: 0, maximum: 10000000 }
        category: { type: string, maxLength: 100 }
        active: { type: boolean }

    ImportBatchResponseDTO:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ImportProductResultDTO' }

    ImportProductResultDTO:
      type: object
      required: [lineNumber, action]
      properties:
        lineNumber: { type: integer }
        action: { type: string, enum: [CREATED, UPDATED, IGNORED, ERROR] }
        productId: { type: string }
        error: { type: string }

    ErrorDTO:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    TwoFactorErrorDTO:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        remainingAttempts:
          type: integer
        lockedUntil:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time

    PixSettingsDTO:
      type: object
      properties:
        provider:
          type: string
          example: MERCADO_PAGO
        enabled:
          type: boolean
        configured:
          type: boolean
        accountName:
          type: string
        accessTokenHint:
          type: string
        webhookSecretConfigured:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    UpdatePixSettingsDTO:
      type: object
      properties:
        enabled:
          type: boolean
        accessToken:
          type: string
          maxLength: 500
          description: Access Token de produção da conta Mercado Pago; vazio mantém o atual
        webhookSecret:
          type: string
          maxLength: 500
          description: Assinatura secreta das notificações; vazio mantém a atual

    PixChargeStatusDTO:
      type: string
      enum: [PENDING, PROCESSING, PAID, EXPIRED, CANCELLED]

    PixChargeDTO:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/PixChargeStatusDTO'
        amount:
          type: number
          format: double
        qrCode:
          type: string
          description: Código Pix copia e cola
        qrCodeBase64:
          type: string
          description: Imagem PNG do QR em base64
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        paidAt:
          type: string
          format: date-time
        saleId:
          type: string
        sale:
          $ref: '#/components/schemas/SaleDTO'
        failureReason:
          type: string

    CashSessionStatusDTO:
      type: string
      enum: [OPEN, CLOSED]

    CashMovementTypeDTO:
      type: string
      enum: [SUPPLY, WITHDRAWAL]

    OpenCashSessionDTO:
      type: object
      required:
        - openingAmount
      properties:
        openingAmount:
          type: number
          format: double
          minimum: 0
          maximum: 1000000

    CreateCashMovementDTO:
      type: object
      required:
        - type
        - amount
      properties:
        type:
          $ref: '#/components/schemas/CashMovementTypeDTO'
        amount:
          type: number
          format: double
          minimum: 0.01
          maximum: 1000000
        reason:
          type: string
          maxLength: 120

    CloseCashSessionDTO:
      type: object
      properties:
        countedAmount:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Dinheiro contado na gaveta; sem ele o caixa fecha sem conferência
        notes:
          type: string
          maxLength: 500

    CashMovementDTO:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/CashMovementTypeDTO'
        amount:
          type: number
          format: double
        reason:
          type: string
        userId:
          type: string
        timestamp:
          type: string
          format: date-time

    PaymentTotalDTO:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        amount:
          type: number
          format: double

    CashSessionSummaryDTO:
      type: object
      properties:
        salesCount:
          type: integer
        salesTotal:
          type: number
          format: double
        discountTotal:
          type: number
          format: double
        surchargeTotal:
          type: number
          format: double
        receivedByMethod:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTotalDTO'
        cashSales:
          type: number
          format: double
        cashRefunds:
          type: number
          format: double
        supplies:
          type: number
          format: double
        withdrawals:
          type: number
          format: double
        expectedCash:
          type: number
          format: double

    CashSessionDTO:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        operatorName:
          type: string
        status:
          $ref: '#/components/schemas/CashSessionStatusDTO'
        openedAt:
          type: string
          format: date-time
        openingAmount:
          type: number
          format: double
        movements:
          type: array
          items:
            $ref: '#/components/schemas/CashMovementDTO'
        closedAt:
          type: string
          format: date-time
        closedByUserId:
          type: string
        countedAmount:
          type: number
          format: double
        difference:
          type: number
          format: double
        notes:
          type: string
        summary:
          $ref: '#/components/schemas/CashSessionSummaryDTO'
        pendingDeliveryOrders:
          type: integer

    DeliveryOrderStatusDTO:
      type: string
      enum: [AWAITING_PAYMENT, RECEIVED, ACCEPTED, DISPATCHED, COMPLETED, CANCELLED]

    DeliveryFulfillmentDTO:
      type: string
      enum: [DELIVERY, PICKUP]

    DeliveryPaymentMethodDTO:
      type: string
      enum: [PIX, CASH, CARD]

    DeliverySettingsDTO:
      type: object
      properties:
        enabled: { type: boolean }
        open: { type: boolean }
        slug: { type: string }
        storeName: { type: string }
        whatsapp: { type: string }
        message: { type: string }
        deliveryFee: { type: number, format: double }
        minimumOrder: { type: number, format: double }
        estimatedMinutes: { type: integer }
        deliveryAvailable: { type: boolean }
        pickupAvailable: { type: boolean }
        pickupAddress: { type: string }
        acceptedPayments:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryPaymentMethodDTO'
        pixKey: { type: string }

    UpdateDeliverySettingsDTO:
      type: object
      required: [enabled, open, whatsapp, deliveryFee, minimumOrder, estimatedMinutes, deliveryAvailable, pickupAvailable, acceptedPayments]
      properties:
        enabled: { type: boolean }
        open: { type: boolean }
        whatsapp: { type: string, maxLength: 20 }
        message: { type: string, maxLength: 280 }
        deliveryFee: { type: number, format: double, minimum: 0, maximum: 1000 }
        minimumOrder: { type: number, format: double, minimum: 0, maximum: 100000 }
        estimatedMinutes: { type: integer, minimum: 5, maximum: 600 }
        deliveryAvailable: { type: boolean }
        pickupAvailable: { type: boolean }
        pickupAddress: { type: string, maxLength: 200 }
        acceptedPayments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeliveryPaymentMethodDTO'
        pixKey: { type: string, maxLength: 120 }

    DeliveryAddressDTO:
      type: object
      required: [street, number, district]
      properties:
        street: { type: string, minLength: 2, maxLength: 120 }
        number: { type: string, minLength: 1, maxLength: 20 }
        complement: { type: string, maxLength: 80 }
        district: { type: string, minLength: 2, maxLength: 80 }
        reference: { type: string, maxLength: 120 }

    DeliveryOrderItemDTO:
      type: object
      properties:
        productId: { type: string }
        description: { type: string }
        unitPrice: { type: number, format: double }
        quantity: { type: integer }
        notes: { type: string }
        subtotal: { type: number, format: double }

    DeliveryOrderDTO:
      type: object
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/DeliveryOrderStatusDTO'
        fulfillment:
          $ref: '#/components/schemas/DeliveryFulfillmentDTO'
        customerName: { type: string }
        customerPhone: { type: string }
        address:
          $ref: '#/components/schemas/DeliveryAddressDTO'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryOrderItemDTO'
        subtotal: { type: number, format: double }
        deliveryFee: { type: number, format: double }
        total: { type: number, format: double }
        paymentMethod:
          $ref: '#/components/schemas/DeliveryPaymentMethodDTO'
        changeFor: { type: number, format: double }
        notes: { type: string }
        saleId: { type: string }
        paidAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UpdateDeliveryOrderStatusDTO:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/DeliveryOrderStatusDTO'

    CompleteDeliveryOrderDTO:
      type: object
      properties:
        paymentMethod:
          type: string
          description: Dispensado quando o pedido já foi pago pelo Pix integrado
          enum: [CASH, CREDIT_CARD, DEBIT_CARD, PIX]

    PublicDeliveryProductDTO:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        category: { type: string }
        price: { type: number, format: double }
        available: { type: boolean }
        maxQuantity: { type: integer }

    PublicDeliveryStoreDTO:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        open: { type: boolean }
        message: { type: string }
        deliveryFee: { type: number, format: double }
        minimumOrder: { type: number, format: double }
        estimatedMinutes: { type: integer }
        deliveryAvailable: { type: boolean }
        pickupAvailable: { type: boolean }
        pickupAddress: { type: string }
        acceptedPayments:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryPaymentMethodDTO'
        pixIntegrated:
          type: boolean
          description: A loja gera QR code do Pix e o pedido só entra na fila depois de pago
        products:
          type: array
          items:
            $ref: '#/components/schemas/PublicDeliveryProductDTO'

    PlaceDeliveryOrderItemDTO:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, minLength: 1, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        notes: { type: string, maxLength: 140 }

    PlaceDeliveryOrderDTO:
      type: object
      required: [customerName, customerPhone, fulfillment, paymentMethod, items]
      properties:
        customerName: { type: string, minLength: 2, maxLength: 80 }
        customerPhone: { type: string, minLength: 10, maxLength: 20 }
        fulfillment:
          $ref: '#/components/schemas/DeliveryFulfillmentDTO'
        address:
          $ref: '#/components/schemas/DeliveryAddressDTO'
        paymentMethod:
          $ref: '#/components/schemas/DeliveryPaymentMethodDTO'
        changeFor: { type: number, format: double, minimum: 0, maximum: 100000 }
        notes: { type: string, maxLength: 280 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PlaceDeliveryOrderItemDTO'

    PlacedDeliveryOrderDTO:
      type: object
      properties:
        id: { type: string }
        number: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/DeliveryOrderStatusDTO'
        fulfillment:
          $ref: '#/components/schemas/DeliveryFulfillmentDTO'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryOrderItemDTO'
        subtotal: { type: number, format: double }
        deliveryFee: { type: number, format: double }
        total: { type: number, format: double }
        paymentMethod:
          $ref: '#/components/schemas/DeliveryPaymentMethodDTO'
        pixKey: { type: string }
        paid: { type: boolean }
        pix:
          $ref: '#/components/schemas/PublicDeliveryPixDTO'
        whatsappUrl: { type: string }
        createdAt: { type: string, format: date-time }

    PublicDeliveryPixDTO:
      type: object
      properties:
        qrCode: { type: string }
