
services:
  mongodb:
    image: mongo:7
    container_name: binitech-pdv-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=binitech_pdv

  product-import-mongodb:
    image: mongo:8
    container_name: binitech-product-import-mongo
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - product_import_mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=binitech_product_import

  rabbitmq:
    image: rabbitmq:3-management
    container_name: binitech-pdv-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}

  product-import-service:
    build: ./product-import-service
    container_name: binitech-product-import
    depends_on:
      - product-import-mongodb
      - rabbitmq
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      PORT: 8082
      PRODUCT_IMPORT_MONGODB_URI: mongodb://product-import-mongodb:27017
      PRODUCT_IMPORT_MONGODB_DATABASE: binitech_product_import
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Defina RABBITMQ_USERNAME no arquivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      PDV_SERVICE_URL: http://host.docker.internal:8080
      PRODUCT_IMPORT_SERVICE_KEY: ${PRODUCT_IMPORT_SERVICE_KEY:?Defina PRODUCT_IMPORT_SERVICE_KEY no arquivo .env}
      CORS_ALLOWED_ORIGINS: http://localhost:4200

volumes:
  mongo_data:
  product_import_mongo_data:

