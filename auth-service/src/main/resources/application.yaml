spring:
  application:
    name: binitech-auth
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${AUTH_MONGODB_URI}
      database: ${AUTH_MONGODB_DATABASE:binitech_pdv}
      auto-index-creation: true
    redis:
      url: ${AUTH_REDIS_URL}
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
security:
  pepper: ${SECURITY_PEPPER}
cors:
  allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:4200}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
