# Use with: docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d mongodb redis auth-service
services:
  auth-mongodb:
    image: mongo:8
    volumes:
      - auth_mongo_data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: https://github.com/niicsz/BiniTech-Auth.git#7bf1d3d0be03e3f42a692d5b0bf5820cbef6c1a1
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      AUTH_MONGODB_URI: mongodb://auth-mongodb:27017
      AUTH_MONGODB_DATABASE: binitech_auth
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY:?Defina AUTH_SERVICE_KEY no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      SECURITY_PEPPER: ${SECURITY_PEPPER:?Defina SECURITY_PEPPER no arquivo .env}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      auth-mongodb:
        condition: service_started

volumes:
  auth_mongo_data:
  auth_redis_data:
