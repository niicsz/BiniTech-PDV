# Use with: docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d mongodb redis auth-service
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  auth-service:
    build:
      context: https://github.com/niicsz/BiniTech-Auth.git#91aced7890dbe9d34fdcf95fb543ba05d86e2608
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      AUTH_MONGODB_URI: mongodb://mongodb:27017
      AUTH_MONGODB_DATABASE: binitech_pdv
      AUTH_REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      SECURITY_PEPPER: ${SECURITY_PEPPER:?Defina SECURITY_PEPPER no arquivo .env}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      AUTH_CORS_ALLOWED_ORIGINS: ${AUTH_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  auth_redis_data:
